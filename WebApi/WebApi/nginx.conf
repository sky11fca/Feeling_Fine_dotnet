pid /tmp/nginx.pid;

events { }

http {
    include mime.types;
    types {
        application/wasm wasm;
    }

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Prevent the "Magic Word" error by returning a real 404 for missing assets
        # instead of incorrectly serving index.html
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|dll|json|blat|dat)$ {
            try_files $uri =404;
        }
    }
}
