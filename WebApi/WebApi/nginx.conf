pid /tmp/nginx.pid;

events { }

http {
    include mime.types;
    types {
        application/wasm wasm;
    }

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            # Only fallback to index.html for URL routing
            try_files $uri $uri/ /index.html;
        }

        # FORCE 404 for missing static files to prevent Magic Word errors
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|dll|json|blat|dat)$ {
            try_files $uri =404;
        }
    }
}
