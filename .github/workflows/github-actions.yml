name: CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build, Test & Analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4 # v4.2.1
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Set up Python
        uses: actions/setup-python@v4 # v4.7.1
        with:
          python-version: '3.x'

      - uses: actions/checkout@v4 # v4.1.7
        with:
          fetch-depth: 0

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4 # v4.0.2
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4 # v4.0.2
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and Analyze Solution
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JwtSettings__Secret: ${{ secrets.JWT_SECRET }}
          JwtSettings__Issuer: FeelingFine
          JwtSettings__Audience: FeelingFine
        shell: powershell
        run: |

          dotnet restore "DotnetApi/DotnetApi.WebApi/DotnetApi.WebApi.csproj"
          dotnet restore "WebApi/WebApi/WebApi.csproj"


          # Use the scanner to begin analysis for the entire .NET suite
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"sky11fca_Feeling_Fine_dotnet" `
            /o:"sky11fca" `
            /d:sonar.token="$($env:SONAR_TOKEN)" `
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/wwwroot/**,**/DotnetApi.Tests/**,**/WebApi.Tests/**,**/PythonAI/tests/**." `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
            /d:sonar.python.version="3.x" `
            /d:sonar.python.coverage.reportPaths="**/coverage.xml"

          # Build the .NET API and the Blazor Web API
          dotnet build "DotnetApi/DotnetApi.WebApi/DotnetApi.WebApi.csproj" --no-restore
          dotnet build "WebApi/WebApi/WebApi.csproj" --no-restore

          # Build Python AI
          if (Test-Path "PythonAI/requirements.txt") { 
            python -m pip install --upgrade pip 
            pip install -r "PythonAI/requirements.txt" 
            pytest --cov=. --cov-report=xml:PythonAI/coverage.xml "PythonAI/tests"
          }

          # Running Test Coverage
          dotnet test "DotnetApi/DotnetApi.Tests/DotnetApi.Tests.csproj" --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          dotnet test "WebApi/WebApi.Tests/WebApi.Tests.csproj" --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          
          
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="$($env:SONAR_TOKEN)"

  build-and-push-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v4.1.7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DotnetApi
        uses: docker/build-push-action@8a750363344879de34d32415e64e8c4470a02c75 # v5.4.0
        with:
          context: ./DotnetApi
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/feelingfine-dotnet-api:latest

      - name: Build and push PythonAI
        uses: docker/build-push-action@8a750363344879de34d32415e64e8c4470a02c75 # v5.4.0
        with:
          context: ./PythonAI
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/feelingfine-python-ai:latest

      - name: Build and push WebApi (Blazor UI)
        uses: docker/build-push-action@8a750363344879de34d32415e64e8c4470a02c75 # v5.4.0
        with:
          context: ./WebApi
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/feelingfine-web-ui:latest