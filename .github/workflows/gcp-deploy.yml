name: Deploy to Google App Engine

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.io

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy Python AI Service
      run: |
        gcloud app deploy PythonAI/app.yaml --quiet

    - name: Deploy Dotnet API Service
      run: |
        gcloud app deploy DotnetApi/DotnetApi.WebApi/app.yaml --quiet

    - name: Deploy Web UI (Default) Service
      run: |
        gcloud app deploy WebApi/WebApi/app.yaml --quiet

    - name: Deploy Dispatch Rules
      run: |
        gcloud app deploy dispatch.yaml --quiet
