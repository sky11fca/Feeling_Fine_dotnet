name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Python AI
        uses: docker/build-push-action@v5
        with:
          context: ./PythonAI
          file: ./PythonAI/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO }}/python-ai:latest

      - name: Build and push .NET API
        uses: docker/build-push-action@v5
        with:
          context: ./DotnetApi
          file: ./DotnetApi/DotnetApi.WebApi/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO }}/dotnet-api:latest

      - name: Build and push Web UI
        uses: docker/build-push-action@v5
        with:
          context: ./WebApi
          file: ./WebApi/WebApi/Dockerfile
          push: true
          build-args: |
            API_URL=${{ secrets.PUBLIC_DOTNET_API_URL }}
            AI_URL=${{ secrets.PUBLIC_PYTHON_AI_URL }}
          tags: ghcr.io/${{ env.REPO }}/web-ui:latest