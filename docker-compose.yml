services:
  # ---------------------------------------------------------
  # Ollama Local LLM Service
  # ---------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: feelingfine-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Helper service to automatically pull the models used in the AI services
  ollama-init:
    image: ollama/ollama:latest
    container_name: feelingfine-ollama-init
    depends_on:
      - ollama
    command: pull gemma:2b
    environment:
      - OLLAMA_HOST=ollama:11434

  # ---------------------------------------------------------
  # Python AI Module
  # ---------------------------------------------------------
  python-ai:
    build:
      context: ./PythonAI
      dockerfile: Dockerfile
    container_name: feelingfine-python-ai
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=${OLLAMA_URL}
      - HF_HOME=/huggingface_cache
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      - ollama
    volumes:
      - hf_data:/huggingface_cache
    restart: unless-stopped

  # ---------------------------------------------------------
  # Redis Cache Service
  # ---------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: feelingfine-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ---------------------------------------------------------
  # .NET EF Core API
  # ---------------------------------------------------------
  dotnet-api:
    build:
      context: ./DotnetApi
      dockerfile: DotnetApi.WebApi/Dockerfile
    container_name: feelingfine-dotnet-api
    ports:
      - "5160:5160"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5160
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - AiServiceUrl=${PYTHON_AI_URL}/ai/review/
      - Redis__ConnectionString=${REDIS_URL}
    depends_on:
      - redis
    restart: unless-stopped

  # ---------------------------------------------------------
  # Web UI (Blazor WebAssembly)
  # ---------------------------------------------------------
  web-ui:
    build:
      context: ./WebApi
      dockerfile: WebApi/Dockerfile
      args:
        - API_URL=${PUBLIC_DOTNET_API_URL}
        - AI_URL=${PUBLIC_PYTHON_AI_URL}
    container_name: feelingfine-web-ui
    ports:
      - "3000:8080"
    environment:
      - ASPNETCORE_HTTP_PORTS=3000
      - API_URL=${PUBLIC_DOTNET_API_URL}
      - AI_URL=${PUBLIC_PYTHON_AI_URL}
    depends_on:
      - dotnet-api
      - python-ai
    restart: unless-stopped

volumes:
  ollama_data:
  hf_data:
