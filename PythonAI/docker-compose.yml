services:
  api:
    build: .
    container_name: python_ai_api
    ports:
      - "8000:8000"
    environment:
      # Pass the Ollama host URL to your application
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      # Mounts your local directory to /app for hot-reloading during development
      - .:/app

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      # Persist downloaded models so they aren't lost when the container stops
      - ollama_data:/root/.ollama
    # Uncomment the block below to enable GPU acceleration if you have an NVIDIA GPU
#    deploy:
#      resources:
#       reservations:
#         devices:
#           - driver: nvidia
#             count: 1
#             capabilities: [gpu]

volumes:
  ollama_data: